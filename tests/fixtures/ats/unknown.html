<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Generic Application</title>
</head>
<body>
  <form class="generic-application-form">
    <label for="applicant_name">Name *</label>
    <input id="applicant_name" name="applicant_name" type="text" required>

    <label for="applicant_email">Email *</label>
    <input id="applicant_email" name="applicant_email" type="email" required>

    <label for="applicant_phone">Phone *</label>
    <input id="applicant_phone" name="applicant_phone" type="tel" required>

    <label for="additional_notes">Additional notes</label>
    <textarea id="additional_notes" name="additional_notes" rows="4"></textarea>

    <button type="submit">Apply</button>
  </form>
  <script src="fake_submit.js"></script>
</body>
</html>
