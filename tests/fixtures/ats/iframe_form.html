<!DOCTYPE html>
<!--
  The ATS form, as served inside `iframe_host.html`.

  Everything but the last name is pre-filled, so the one gap is the one the
  writer has to find through the frame — and native constraint validation
  blocks the submit until it does, which is what stops the submitter test
  passing on a half-filled form.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Application form</title>
</head>
<body>
  <form id="application-form" data-source="greenhouse" class="application-form">
    <label for="first_name">First name *</label>
    <input id="first_name" name="first_name" type="text" value="Alex" required>

    <label for="last_name">Last name *</label>
    <input id="last_name" name="last_name" type="text" required>

    <label for="email">Email *</label>
    <input id="email" name="email" type="email" value="alex.rivera@example.com" required>

    <label for="cover_letter">Cover letter</label>
    <textarea id="cover_letter" name="cover_letter" rows="4"></textarea>

    <button type="submit">Submit application</button>
  </form>
  <script src="fake_submit.js"></script>
</body>
</html>
